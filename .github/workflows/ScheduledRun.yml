name: MeroShare IPO Bot

on:
  schedule:
    # 15:00 Nepal time (UTC+05:45) = 09:15 UTC
    - cron: '15 9 * * 1,4,6'   # Mon(1), Thu(4), Sat(6)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          # MeroShare (Primary)
          MEROSHARE_CLIENT_ID: ${{ secrets.MEROSHARE_CLIENT_ID }}
          MEROSHARE_DP_NAME: ${{ secrets.MEROSHARE_DP_NAME }}
          MEROSHARE_USERNAME: ${{ secrets.MEROSHARE_USERNAME }}
          MEROSHARE_PASSWORD: ${{ secrets.MEROSHARE_PASSWORD }}

          # Apply details (Primary)
          MEROSHARE_BANK_NAME: ${{ secrets.MEROSHARE_BANK_NAME }}
          MEROSHARE_ACCOUNT_NO: ${{ secrets.MEROSHARE_ACCOUNT_NO }}
          MEROSHARE_CRN: ${{ secrets.MEROSHARE_CRN }}
          MEROSHARE_TXN_PIN: ${{ secrets.MEROSHARE_TXN_PIN }}

          # MeroShare (Fallback / Wife)
          MEROSHARE_CLIENT_ID_WIFE: ${{ secrets.MEROSHARE_CLIENT_ID_WIFE }}
          MEROSHARE_DP_NAME_WIFE: ${{ secrets.MEROSHARE_DP_NAME_WIFE }}
          MEROSHARE_USERNAME_WIFE: ${{ secrets.MEROSHARE_USERNAME_WIFE }}
          MEROSHARE_PASSWORD_WIFE: ${{ secrets.MEROSHARE_PASSWORD_WIFE }}

          # Apply details (Wife)
          MEROSHARE_BANK_NAME_WIFE: ${{ secrets.MEROSHARE_BANK_NAME_WIFE }}
          MEROSHARE_ACCOUNT_NO_WIFE: ${{ secrets.MEROSHARE_ACCOUNT_NO_WIFE }}
          MEROSHARE_CRN_WIFE: ${{ secrets.MEROSHARE_CRN_WIFE }}
          MEROSHARE_TXN_PIN_WIFE: ${{ secrets.MEROSHARE_TXN_PIN_WIFE }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Runtime
          HEADLESS: "true"
          RUN_MODE: "multi"  # if your code supports; otherwise ignored

        run: |
          # If you have multi-user runner:
          if [ -f "src/multi-user.js" ]; then
            node src/multi-user.js
          else
            npm start
          fi
