name: MeroShare IPO Bot

on:
  schedule:
    - cron: '15 9 * * 1,4,6'   # Mon, Thu, Sat @ 15:00 NPT (09:15 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Safe debug: confirm secrets are present
      - name: Debug secrets presence
        env:
          U1: ${{ secrets.MEROSHARE_USERNAME }}
          P1: ${{ secrets.MEROSHARE_PASSWORD }}
          U2: ${{ secrets.MEROSHARE_USERNAME_WIFE }}
          P2: ${{ secrets.MEROSHARE_PASSWORD_WIFE }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Secrets status:"
          echo "Profile 1 user/pass: ${U1:+YES}/${P1:+YES}"
          echo "Profile 2 user/pass: ${U2:+YES}/${P2:+YES}"
          echo "Telegram: ${TG_TOKEN:+YES}/${TG_CHAT:+YES}"

      - name: Run MeroShare Bot
        env:
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Profile 1 (Sabal)
          MEROSHARE_NAME_1: "Sabal"
          MEROSHARE_CLIENT_ID_1: ${{ secrets.MEROSHARE_CLIENT_ID }}
          MEROSHARE_DP_NAME_1: ${{ secrets.MEROSHARE_DP_NAME }}
          MEROSHARE_USERNAME_1: ${{ secrets.MEROSHARE_USERNAME }}
          MEROSHARE_PASSWORD_1: ${{ secrets.MEROSHARE_PASSWORD }}
          MEROSHARE_BANK_NAME_1: ${{ secrets.MEROSHARE_BANK_NAME }}
          MEROSHARE_ACCOUNT_NO_1: ${{ secrets.MEROSHARE_ACCOUNT_NO }}
          MEROSHARE_CRN_1: ${{ secrets.MEROSHARE_CRN }}
          MEROSHARE_TXN_PIN_1: ${{ secrets.MEROSHARE_TXN_PIN }}

          # Profile 2 (Sabina)
          MEROSHARE_NAME_2: "Sabina"
          MEROSHARE_CLIENT_ID_2: ${{ secrets.MEROSHARE_CLIENT_ID_WIFE }}
          MEROSHARE_DP_NAME_2: ${{ secrets.MEROSHARE_DP_NAME_WIFE }}
          MEROSHARE_USERNAME_2: ${{ secrets.MEROSHARE_USERNAME_WIFE }}
          MEROSHARE_PASSWORD_2: ${{ secrets.MEROSHARE_PASSWORD_WIFE }}
          MEROSHARE_BANK_NAME_2: ${{ secrets.MEROSHARE_BANK_NAME_WIFE }}
          MEROSHARE_ACCOUNT_NO_2: ${{ secrets.MEROSHARE_ACCOUNT_NO_WIFE }}
          MEROSHARE_CRN_2: ${{ secrets.MEROSHARE_CRN_WIFE }}
          MEROSHARE_TXN_PIN_2: ${{ secrets.MEROSHARE_TXN_PIN_WIFE }}

          # Runtime
          HEADLESS: "true"
          RUN_MODE: "multi"

        run: node src/multi-user.js
