name: MeroShare IPO Bot

on:
  schedule:
    # 15:00 Nepal time (UTC+05:45) = 09:15 UTC
    - cron: '15 9 * * 1,4,6'   # Mon, Thu, Sat
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MeroShare Bot
        env:
          # ---------- Telegram ----------
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ========= PROFILE 1 (You) =========
          MEROSHARE_NAME_1: Sabal
          MEROSHARE_CLIENT_ID_1: ${{ secrets.MEROSHARE_CLIENT_ID }}
          MEROSHARE_DP_NAME_1: ${{ secrets.MEROSHARE_DP_NAME }}
          MEROSHARE_USERNAME_1: ${{ secrets.MEROSHARE_USERNAME }}
          MEROSHARE_PASSWORD_1: ${{ secrets.MEROSHARE_PASSWORD }}
          MEROSHARE_BANK_NAME_1: ${{ secrets.MEROSHARE_BANK_NAME }}
          MEROSHARE_ACCOUNT_NO_1: ${{ secrets.MEROSHARE_ACCOUNT_NO }}
          MEROSHARE_CRN_1: ${{ secrets.MEROSHARE_CRN }}
          MEROSHARE_TXN_PIN_1: ${{ secrets.MEROSHARE_TXN_PIN }}

          # ========= PROFILE 2 (Wife) =========
          MEROSHARE_NAME_2: Sabina
          MEROSHARE_CLIENT_ID_2: ${{ secrets.MEROSHARE_CLIENT_ID_WIFE }}
          MEROSHARE_DP_NAME_2: ${{ secrets.MEROSHARE_DP_NAME_WIFE }}
          MEROSHARE_USERNAME_2: ${{ secrets.MEROSHARE_USERNAME_WIFE }}
          MEROSHARE_PASSWORD_2: ${{ secrets.MEROSHARE_PASSWORD_WIFE }}
          MEROSHARE_BANK_NAME_2: ${{ secrets.MEROSHARE_BANK_NAME_WIFE }}
          MEROSHARE_ACCOUNT_NO_2: ${{ secrets.MEROSHARE_ACCOUNT_NO_WIFE }}
          MEROSHARE_CRN_2: ${{ secrets.MEROSHARE_CRN_WIFE }}
          MEROSHARE_TXN_PIN_2: ${{ secrets.MEROSHARE_TXN_PIN_WIFE }}

          # ---------- Runtime ----------
          HEADLESS: "true"
          RUN_MODE: "multi"

        run: |
          echo "Starting MeroShare IPO Bot..."
          if [ -f "src/multi-user.js" ]; then
            node src/multi-user.js
          else
            npm start
          fi
